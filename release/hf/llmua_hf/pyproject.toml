[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmua-hf"
version = "0.1.0"
description = "LLMUA decoder for Hugging Face transformers (model_type 'llmua')"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "transformers>=4.57,<6"]      # tested: transformers 4.57.6 and 5.22.2

# this directory is itself the package `llmua_hf`
[tool.setuptools]
packages = ["llmua_hf"]
package-dir = { "llmua_hf" = "." }
