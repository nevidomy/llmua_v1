[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmua1"
version = "1.0.0"
description = "A controlled scaling ladder for Ukrainian language models: code for Paper 1"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["model*", "data*", "tokens*", "sft*", "evaluation*", "analysis*", "experiments*"]
